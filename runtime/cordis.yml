# Desktop-optimized DSH JSON-RPC runtime configuration.
# This config is bundled with the desktop app and used when launching
# the dsh-jsonrpc-agent subprocess.
#
# Environment variables consumed:
#   DSH_CORDIS_CONFIG  - path to this file (set automatically)
#   DSH_CWD           - workspace root
#   DSH_SESSION_ROOT  - session storage directory
#   DSH_MAX_TOKENS_AS_SUCCESS - true/false
#   DEEPSEEK_API_KEY  - credential (provided by user settings)
#   DEEPSEEK_BASE_URL - optional base URL override

# Stdio JSON-RPC server entry — the agent has no external client without this.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js process.env.DSH_MAX_TOKENS_AS_SUCCESS === 'true'

# The DeepSeek adapter resolves credentials from the environment (user-provided API key).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Persistence: durable sessions on disk.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

# Checkpoint policy: durable tool-dispatch and completed-step markers.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Subprocess + bash execution.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000

# Local filesystem provider.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Agent spine — headless coding agent.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# Subagent delegation (in-process).
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

# Token metering.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Compaction: keep context manageable.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
