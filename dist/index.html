<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH Desktop (Tauri)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0a0e14;color:#e6edf3}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0d1219;border-bottom:1px solid #1b2430}
header h1{font-size:15px;font-weight:600}
.status{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}.dot.ok{background:#34d399}.dot.err{background:#f87171}
#connect{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:30px;max-width:460px;margin:0 auto;width:100%}
#connect .card{width:100%;background:#0d1219;border:1px solid #1b2430;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
#connect label{font-size:12px;color:#8b97a8;display:flex;flex-direction:column;gap:5px}
#connect input{background:#0a0e14;border:1px solid #1b2430;border-radius:6px;padding:8px 10px;color:#e6edf3;font-size:13px;outline:none}
#connect input:focus{border-color:#4f8cff}
.btn{background:#4f8cff;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:500}.btn:hover{background:#6b9eff}.btn.ghost{background:transparent;border:1px solid #1b2430;color:#8b97a8}
#chat{display:none;flex-direction:column;flex:1;min-height:0}#chat.on{display:flex}
#msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#4f8cff;color:#fff;border-bottom-right-radius:3px}
.msg.assist{align-self:flex-start;background:#161c26;border:1px solid #1b2430;border-bottom-left-radius:3px}
#inputbar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #1b2430;background:#0d1219}
#inputbar textarea{flex:1;background:#0a0e14;border:1px solid #1b2430;border-radius:8px;padding:9px 11px;color:#e6edf3;font-size:13px;resize:none;outline:none;font-family:inherit;min-height:36px;max-height:120px}
#inputbar textarea:focus{border-color:#4f8cff}
</style></head><body><div id="app">
<header><h1>DSH Desktop <span style="color:#5a6675;font-weight:400;font-size:12px">(Rust / Tauri)</span></h1>
<div class="status"><span class="dot" id="dot"></span><span id="statusText">disconnected</span></div></header>
<div id="connect"><div class="card">
<label>Workspace (cwd)<input id="fCwd" value="."></label>
<label>Provider<input id="fProv" value="deepseek"></label>
<label>Model<input id="fModel" value="deepseek-chat"></label>
<label>API Key (DEEPSEEK_API_KEY)<input id="fKey" type="password"></label>
<label>Runtime path<input id="fRun" value="../../packages/examples/jsonrpc-demo/src/bin.ts"></label>
<label>Max tokens<input id="fTok"></label>
<button class="btn" id="btnConn" style="margin-top:6px">Connect</button>
<div id="connErr" style="font-size:12px;color:#f87171;min-height:16px"></div>
</div></div>
<div id="chat"><div id="msgs"></div>
<div id="inputbar"><textarea id="inp" placeholder="Type a message..." rows="1"></textarea><button class="btn" id="btnSend">Send</button><button class="btn ghost" id="btnDisc">Disconnect</button></div>
</div></div><script src="app.js"></script></body></html>
